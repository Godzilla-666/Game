

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressourcen-Baukarten</title>

<style>
 
   
* {
    box-sizing: border-box;
}

body {
    background-image: url("background.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
   }

.map {
    position: relative;
    width: min(100%, 1664px);
    aspect-ratio: 1664 / 928;
    background-image: url("Game chat.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Quadratische Buttons */
.build-button {
    position: absolute;
    width: 3.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: rgba(45, 45, 45, 0.85);
    border: 3px solid #d9b45b;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 2;
}

/* Hover-Effekt */
.build-button:hover,
.build-button:focus {
    background: rgba(218, 170, 65, 0.95);
    transform: translate(-50%, -50%) scale(1.15);
    border-color: white;
    outline: none;
}

/* Preis-Anzeige */
.price {
    display: none;
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    background: #292929;
    color: white;
    border: 2px solid #d9b45b;
    border-radius: 6px;
    padding: 8px 12px;
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 3px 10px #000;
}

.build-button:hover .price,
.build-button:focus .price {
    display: block;
}

.name {
    color: #FFFFFF;
}
 
.gold {
    color: #ffd447;
}

.wood {
    color: #c98a4b;
}


/* NEUE UNTERMENÜ-BUTTONS */

.added-submenu {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    transform: translateX(-50%);
    z-index: 100;
}

/* Eigenes Design der neuen Buttons */
.extra-build-button {
    position: relative;
    width: 95px;
    height: 35px;
    background: linear-gradient(#315b37, #193a22);
    border: 2px solid #d6ad50;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 3px 6px #0009;
    transition: 0.2s;
}

.extra-build-button:hover {
    background: linear-gradient(#548c48, #315b37);
    border-color: white;
    transform: scale(1.08);
}

/*Anzeige */
.other {
    display: none;
    position: absolute;
    left: 105%;
    top: 50%;
    transform: translateY(-50%);
    background: #222;
    color: white;
    border: 2px solid #d6ad50;
    padding: 7px;
    border-radius: 5px;
    white-space: nowrap;
    z-index: 200;
    font-size: 12px;
}

.extra-build-button:hover .other {
    display: block;
}

</style>
</head>
 
<script> 


/* NEUES UNTERMENÜ-SYSTEM */

(function () {

    const map = document.querySelector(".map");

    if (!map) {
        console.error("Die Karte mit class='map' wurde nicht gefunden!");
        return;
    }

    map.addEventListener("click", function (event) {

        // Prüfen, ob ein Hauptbutton angeklickt wurde
        const button = event.target.closest(
            ".build-button:not(.extra-build-button)"
        );

        if (!button || !map.contains(button)) return;

        event.preventDefault();
        event.stopPropagation();

        // Alle bisherigen Untermenüs schließen
        map.querySelectorAll(".added-submenu").forEach(menu => {
            menu.remove();
        });

        // Position des Hauptbuttons ermitteln
        const mapRect = map.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();

        const x = (
            (buttonRect.left + buttonRect.width / 2 - mapRect.left)
            / mapRect.width
        ) * 100;

        const y = (
            (buttonRect.bottom - mapRect.top)
            / mapRect.height
        ) * 100;

        // Untermenü erstellen
        const menu = document.createElement("div");
        menu.className = "added-submenu";

        menu.style.left = x + "%";
        menu.style.top = y + "%";

        // Drei neue Buttons erstellen
        const buildings = ["Haus", "Turm", "Kaserne"];

        buildings.forEach(name => {

            const newButton = document.createElement("button");

            newButton.type = "button";
            newButton.className = "extra-build-button";

            newButton.innerHTML = `
                ${name}
                <span class="extra-price">
                    <span style="color:#ffd447">50 Gold</span>
                    |
                    <span style="color:#c98a4b">20 Holz</span>
                </span>
            `;

            newButton.addEventListener("click", function(e) {
                e.stopPropagation();
                console.log(name + " ausgewählt!");
            });

            menu.appendChild(newButton);

        });

        map.appendChild(menu);

    }, true);

})();

 
</script>
