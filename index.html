

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressourcen-Baukarten</title>

<style>
 
   body {
    background-image: url("background.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
   }

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.map {
    position: relative;
    width: min(100%, 1664px);
    aspect-ratio: 1664 / 928;
    background-image: url("Game chat.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Quadratische Buttons */
.build-button {
    position: absolute;
    width: 3.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: rgba(45, 45, 45, 0.85);
    border: 3px solid #d9b45b;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 2;
}

/* Hover-Effekt */
.build-button:hover,
.build-button:focus {
    background: rgba(218, 170, 65, 0.95);
    transform: translate(-50%, -50%) scale(1.15);
    border-color: white;
    outline: none;
}

/* Preis-Anzeige */
.price {
    display: none;
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    background: #292929;
    color: white;
    border: 2px solid #d9b45b;
    border-radius: 6px;
    padding: 8px 12px;
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 3px 10px #000;
}

.build-button:hover .price,
.build-button:focus .price {
    display: block;
}

.gold {
    color: #ffd447;
}

.wood {
    color: #c98a4b;
}
</style>
</head>
