
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teleport-Bereich</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("background.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.map {
    position: relative;
    width: min(100%, 1664px);
    aspect-ratio: 1664 / 928;
    background-image: url("Game chat.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Überschrift */
.heading {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
}

/* Teleporter */
.teleporter {
    position: absolute;
    width: 125px;
    height: 65px;
    transform: translate(-50%, -50%);
    background: linear-gradient(#315b85, #172e55);
    border: 3px solid #65c9ff;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 12px #299dff;
    transition: 0.2s;
}

.teleporter:hover {
    transform: translate(-50%, -50%) scale(1.12);
    background: linear-gradient(#438bc5, #244d80);
    box-shadow: 0 0 22px #65c9ff;
    border-color: white;
}

/* Zurück-Button */
.back {
    position: fixed;
    bottom: 25px;
    left: 25px;
    padding: 12px 22px;
    background: #292929;
    color: white;
    border: 2px solid #d9b45b;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.back:hover {
    background: #d9a941;
}
</style>
</head>

<body>

<div class="map">

    <div class="heading">
        TELEPORT-BEREICH
    </div>

    <button class="teleporter"
        style="left:35%; top:45%"
        onclick="location.href='teleport1.html'">
        Teleporter 1
    </button>

    <button class="teleporter"
        style="left:50%; top:45%"
        onclick="location.href='teleport2.html'">
        Teleporter 2
    </button>

    <button class="teleporter"
        style="left:65%; top:45%"
        onclick="location.href='teleport3.html'">
        Teleporter 3
    </button>

</div>

<button class="back" onclick="location.href='index.html'">
    ← Zurück
</button>

</body>
</html>
