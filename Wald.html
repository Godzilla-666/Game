
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teleport-Bereich</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("background.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.map {
    position: relative;
    width: min(100%, 1664px);
    aspect-ratio: 1664 / 928;
    background-image: url("Game chat.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Überschrift */
.heading {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
}

/* Teleporter */
.teleporter {
    position: absolute;
    width: 125px;
    height: 65px;
    transform: translate(-50%, -50%);
    background: linear-gradient(#315b85, #172e55);
    border: 3px solid #65c9ff;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 12px #299dff;
    transition: 0.2s;
}

.teleporter:hover {
    transform: translate(-50%, -50%) scale(1.12);
    background: linear-gradient(#438bc5, #244d80);
    box-shadow: 0 0 22px #65c9ff;
    border-color: white;
}

/* Zurück-Button */
.back {
    position: fixed;
    bottom: 25px;
    left: 25px;
    padding: 12px 22px;
    background: #292929;
    color: white;
    border: 2px solid #d9b45b;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.back:hover {
    background: #d9a941;
}
</style>
</head>

<body>

<script>
(function () {

    const map = document.querySelector(".map");

    if (!map) {
        console.error("Karte nicht gefunden!");
        return;
    }

    let activeButton = null;

    map.addEventListener("click", function(event) {

        const button = event.target.closest(
            ".travel-button"
        );

        // Keine Hauptbuttons anklicken
        if (!button || button.closest(".added-submenu")) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        const oldMenu = map.querySelector(".added-submenu");

        // Wenn derselbe Button erneut angeklickt wird:
        if (activeButton === button) {

            if (oldMenu) {
                oldMenu.remove();
            }

            activeButton = null;
            return;
        }

        // Altes Menü schließen
        if (oldMenu) {
            oldMenu.remove();
        }

        activeButton = button;

        // Position bestimmen
        const mapRect = map.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();

        const x =
            ((buttonRect.left + buttonRect.width / 2 - mapRect.left)
            / mapRect.width) * 100;

        const y =
            ((buttonRect.bottom - mapRect.top)
            / mapRect.height) * 100;

        // Menü erstellen
        const menu = document.createElement("div");

        menu.className = "added-submenu";
        menu.style.left = x + "%";
        menu.style.top = y + "%";

        // Drei neue Buttons
        const buildings = ["Wald", "Turm", "Kaserne"];

        buildings.forEach(function(name) {

            const newButton = document.createElement("button");

            newButton.type = "button";
            newButton.className = "extra-build-button";

            newButton.innerHTML = `
                ${name}
               `;

           newButton.addEventListener("click", function(e) {
    e.stopPropagation();

    if (name === "Wald") {
        location.href = "Wald.html";
    }

    if (name === "Turm") {
        location.href = "teleport.html";
    }

    if (name === "Kaserne") {
        location.href = "teleport.html";
    }
});

            menu.appendChild(newButton);

        });

        map.appendChild(menu);

    }, true);

})();
</script>


</body>
</html>
