
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("background.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

.map {
    position: relative;
    width: min(100%, 1664px);
    aspect-ratio: 1664 / 928;
    background-image: url("Game chat.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Quadratische Buttons 2*/
.travel-button {
    position: absolute;
    width: 3.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: rgba(45, 45, 45, 0.85);
    border: 3px solid #d9b45b;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 2;
}
 
/* Hover-Effekt */
.build-button:hover,
.build-button:focus {
    background: rgba(218, 170, 65, 0.95);
    transform: translate(-50%, -50%) scale(1.15);
    border-color: white;
    outline: none;
}

/* NEUE UNTERMENÜ-BUTTONS */

.added-submenu {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    transform: translateX(-50%);
    z-index: 100;
}

/* Eigenes Design der neuen Buttons */
.extra-build-button {
    position: relative;
    width: 95px;
    height: 35px;
    background: linear-gradient(#315b37, #193a22);
    border: 2px solid #d6ad50;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 3px 6px #0009;
    transition: 0.2s;
}

.extra-build-button:hover {
    background: linear-gradient(#548c48, #315b37);
    border-color: white;
    transform: translate(-25%, -25%) scale(1.15);
    display: block;
}

/*Anzeige */
.other {
    display: none;
    position: absolute;
    left: 105%;
    top: 50%;
    transform: translateY(-50%);
    background: #222;
    color: white;
    border: 2px solid #d6ad50;
    padding: 7px;
    border-radius: 5px;
    white-space: nowrap;
    z-index: 200;
    font-size: 12px;
}

.extra-build-button:hover .other,
.extra-build-button:focus .other {
    display: block;
}

/* BAUM-BUTTON */

.tree-button {
    position: absolute;
    width: 75px;
    height: 100px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 65px;
    z-index: 10;
    transition: transform 0.2s;
}

.tree-button:hover {
    transform: scale(1.1);
}

/* Fäll-Animation */
.tree-button.falling {
    animation: treeFall 3s ease-in forwards;
    pointer-events: none;
}

@keyframes treeFall {
    0% {
        transform: rotate(0deg);
    }
    35% {
        transform: rotate(15deg);
    }
    65% {
        transform: rotate(40deg);
    }
    100% {
        transform: rotate(90deg);
        opacity: 0;
    }
}

/* Baumstumpf */
.tree-stump {
    font-size: 45px;
    cursor: default;
    position: relative;
}

/* Zeit-Anzeige */
.tree-timer {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #252525;
    color: #fff;
    border: 2px solid #d9b45b;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    white-space: nowrap;
}

.tree-stump:hover .tree-timer {
    display: block;
}


    
</style>
</head>

<body>

<div class="map">

     <button class="travel-button" style="left:105%; top:35%">
        <span class="other">
            <span class="name">Reisen</span> 
        </span>
    </button>

      
<button
    class="tree-button"
    id="tree1"
    style="left:40%; top:50%;"
    onclick="cutTree('tree1')">
    🌳
</button>
    
<button
    class="tree-button"
    id="tree2"
    style="left:60%; top:20%;"
    onclick="cutTree('tree2')">
    🌳
</button>

<button
    class="tree-button"
    id="tree3"
    style="left:57%; top:47%;"
    onclick="cutTree('tree3')">
    🌳
</button>

<button
    class="tree-button"
    id="tree4"
    style="left:80%; top:63%;"
    onclick="cutTree('tree4')">
    🌳
</button>
    
</div>

    
<script>
(function () {

    const map = document.querySelector(".map");

    if (!map) {
        console.error("Karte nicht gefunden!");
        return;
    }

    let activeButton = null;

    map.addEventListener("click", function(event) {

        const button = event.target.closest(
            ".travel-button"
        );

        // Keine Hauptbuttons anklicken
        if (!button || button.closest(".added-submenu")) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        const oldMenu = map.querySelector(".added-submenu");

        // Wenn derselbe Button erneut angeklickt wird:
        if (activeButton === button) {

            if (oldMenu) {
                oldMenu.remove();
            }

            activeButton = null;
            return;
        }

        // Altes Menü schließen
        if (oldMenu) {
            oldMenu.remove();
        }

        activeButton = button;

        // Position bestimmen
        const mapRect = map.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();

        const x =
            ((buttonRect.left + buttonRect.width / 2 - mapRect.left)
            / mapRect.width) * 100;

        const y =
            ((buttonRect.bottom - mapRect.top)
            / mapRect.height) * 100;

        // Menü erstellen
        const menu = document.createElement("div");

        menu.className = "added-submenu";
        menu.style.left = x + "%";
        menu.style.top = y + "%";

        // Drei neue Buttons
        const buildings = ["Stadt", "Turm", "Kaserne"];

        buildings.forEach(function(name) {

            const newButton = document.createElement("button");

            newButton.type = "button";
            newButton.className = "extra-build-button";

            newButton.innerHTML = `
                ${name}
               `;

           newButton.addEventListener("click", function(e) {
    e.stopPropagation();

    if (name === "Stadt") {
        location.href = "index.html";
    }

    if (name === "Turm") {
        location.href = "teleport.html";
    }

    if (name === "Kaserne") {
        location.href = "teleport.html";
    }
});

            menu.appendChild(newButton);

        });

        map.appendChild(menu);

    }, true);

})();
</script>
<script>
function cutTree(treeId) {

    const tree = document.getElementById(treeId);

    // Prüfen, ob der Baum bereits gefällt wird
    if (tree.dataset.cut === "true") return;

    tree.dataset.cut = "true";

    // Fäll-Animation starten
    tree.classList.add("falling");

    // Nach 3 Sekunden Baumstumpf anzeigen
    setTimeout(function() {

        tree.classList.remove("falling");

        tree.classList.add("tree-stump");

        tree.innerHTML = `
            🪵
            <span class="tree-timer" id="${treeId}-timer">
                Baum wächst nach: 45 Sekunden
            </span>
        `;

        tree.style.opacity = "1";
        tree.style.transform = "none";
        tree.style.pointerEvents = "auto";
        tree.onclick = null;

        let remaining = 45;

        const timer = document.getElementById(treeId + "-timer");

        // Wachstumszeit herunterzählen
        const countdown = setInterval(function() {

            remaining--;

            if (timer) {
                timer.textContent =
                    "Baum wächst nach: " + remaining + " Sekunden";
            }

            if (remaining <= 0) {

                clearInterval(countdown);

                // Baum wächst wieder nach
                tree.classList.remove("tree-stump");
                tree.innerHTML = "🌳";

                tree.dataset.cut = "false";

                tree.onclick = function() {
                    cutTree(treeId);
                };

            }

        }, 1000);

    }, 3000);

}
 </script>


</body>
</html>
