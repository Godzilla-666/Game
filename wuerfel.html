
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Würfel-Spiel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #304b69, #101827);
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

h1 {
    font-size: 38px;
    margin-bottom: 65px;
}

.wuerfel-container {
    display: flex;
    gap: 100px;
    perspective: 900px;
    margin-bottom: 80px;
}

.wuerfel-bereich {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
}

.wuerfel-bereich p {
    font-size: 18px;
    font-weight: bold;
}

.wuerfel {
    width: 110px;
    height: 110px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.5s cubic-bezier(.15,.8,.2,1);
}

.seite {
    position: absolute;
    width: 110px;
    height: 110px;
    background: linear-gradient(145deg, #ffffff, #dce4ed);
    border: 3px solid #aab6c4;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: bold;
    color: #17283c;
    box-shadow: inset 0 0 12px #0002;
    backface-visibility: hidden;
}

.vorne  { transform: translateZ(55px); }
.hinten { transform: rotateY(180deg) translateZ(55px); }
.rechts { transform: rotateY(90deg) translateZ(55px); }
.links  { transform: rotateY(-90deg) translateZ(55px); }
.oben   { transform: rotateX(90deg) translateZ(55px); }
.unten  { transform: rotateX(-90deg) translateZ(55px); }

button {
    padding: 18px 60px;
    border: none;
    border-radius: 14px;
    background: #00c896;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 0 #008c69;
    transition: 0.2s;
}

button:hover {
    background: #00e0a9;
    transform: translateY(-3px);
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 3px 0 #008c69;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#ergebnis {
    margin-top: 35px;
    font-size: 25px;
    font-weight: bold;
}

@media(max-width: 500px) {
    .wuerfel-container {
        gap: 35px;
    }

    .wuerfel, .seite {
        width: 85px;
        height: 85px;
    }

    .seite {
        font-size: 40px;
    }

    .vorne  { transform: translateZ(42.5px); }
    .hinten { transform: rotateY(180deg) translateZ(42.5px); }
    .rechts { transform: rotateY(90deg) translateZ(42.5px); }
    .links  { transform: rotateY(-90deg) translateZ(42.5px); }
    .oben   { transform: rotateX(90deg) translateZ(42.5px); }
    .unten  { transform: rotateX(-90deg) translateZ(42.5px); }
}
</style>
</head>

<body>

<h1>🎲 3D Würfel-Spiel 🎲</h1>

<div class="wuerfel-container">

    <div class="wuerfel-bereich">
        <p>Buchstabenwürfel</p>
        <div class="wuerfel" id="buchstabenWuerfel">
            <div class="seite vorne">A</div>
            <div class="seite hinten">B</div>
            <div class="seite rechts">C</div>
            <div class="seite links">D</div>
            <div class="seite oben">E</div>
            <div class="seite unten">F</div>
        </div>
    </div>

    <div class="wuerfel-bereich">
        <p>Zahlenwürfel</p>
        <div class="wuerfel" id="zahlenWuerfel">
            <div class="seite vorne">1</div>
            <div class="seite hinten">6</div>
            <div class="seite rechts">3</div>
            <div class="seite links">4</div>
            <div class="seite oben">5</div>
            <div class="seite unten">2</div>
        </div>
    </div>

</div>

<button id="button" onclick="wuerfeln()">🎲 WÜRFELN</button>

<div id="ergebnis">Bereit zum Würfeln!</div>

<script>
const buchstaben = ["A", "B", "C", "D", "E", "F"];
const zahlen = [1, 2, 3, 4, 5, 6];

// Drehungen, damit die jeweilige Seite vorne landet
const positionen = [
    {x: 0, y: 0},
    {x: 0, y: 180},
    {x: 0, y: -90},
    {x: 0, y: 90},
    {x: -90, y: 0},
    {x: 90, y: 0}
];

let wurf = 0;

function wuerfeln() {
    const buchstabenWuerfel =
        document.getElementById("buchstabenWuerfel");

    const zahlenWuerfel =
        document.getElementById("zahlenWuerfel");

    const button = document.getElementById("button");
    const ergebnis = document.getElementById("ergebnis");

    button.disabled = true;
    ergebnis.textContent = "🎲 Die Würfel rollen...";

    // Zufällige Ergebnisse
    const bIndex = Math.floor(Math.random() * 6);
    const zIndex = Math.floor(Math.random() * 6);

    const bPos = positionen[bIndex];
    const zPos = positionen[zIndex];

    // Jede Runde zusätzliche Drehungen
    const extraB = 360 * (3 + Math.floor(Math.random() * 3));
    const extraZ = 360 * (3 + Math.floor(Math.random() * 3));

    wurf++;

    buchstabenWuerfel.style.transition =
        "transform 1.8s cubic-bezier(.15,.8,.2,1)";

    zahlenWuerfel.style.transition =
        "transform 1.8s cubic-bezier(.15,.8,.2,1)";

    // 3D-Rollbewegung
    buchstabenWuerfel.style.transform =
        `rotateX(${extraB + bPos.x}deg) rotateY(${extraB + bPos.y}deg)`;

    zahlenWuerfel.style.transform =
        `rotateX(${extraZ + zPos.x}deg) rotateY(${extraZ + zPos.y}deg)`;

    setTimeout(() => {
        ergebnis.textContent =
            "Ergebnis: " + buchstaben[bIndex] + " + " + zahlen[zIndex];

        button.disabled = false;
    }, 1850);
}
</script>

</body>
</html>
